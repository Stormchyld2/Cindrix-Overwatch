name: build-android
on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease
      - name: Name the APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/CindrixOverwatch-${VERSION}-android.apk"
          ls -la dist
      - name: Upload the APK (plain file, not zipped)
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: android/dist/*.apk
          archive: false
      - name: Put the download links at the top of the run page
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "## Cindrix Overwatch Android build"
            echo ""
            echo "### [Download the APK from this run]($ARTIFACT_URL)"
            echo ""
            echo "Latest Android build on the Releases page: https://github.com/${GITHUB_REPOSITORY}/releases/tag/android-latest"
            echo ""
            echo "Open the APK on the phone or tablet and allow installing from this source when Android asks."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the APK as the latest Android release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest dist/*.apk --target "$GITHUB_SHA" \
            --title "Cindrix Overwatch: latest Android build" \
            --notes "Built from commit ${GITHUB_SHA::7}. Open the APK on the device and allow installing from this source."
