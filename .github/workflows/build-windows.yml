name: build-windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Window smoke test
        run: python -m tests.smoke_ui
      - name: Real Tor Browser install test
        continue-on-error: true
        run: python -c "import tempfile,os; from cindrix_overwatch import torbrowser as t; d=tempfile.mkdtemp(); p=t.install(d, print); print('INSTALLED', p, os.path.getsize(p))"
      - name: Which command line unpacks the Tor Browser portable exe
        continue-on-error: true
        run: python -m tools.try_tor_install
      - name: Get the Tor Expert Bundle (optional)
        continue-on-error: true
        run: python tools/get_tor_bundle.py
      - name: Build exe
        shell: bash
        run: |
          pip install pyinstaller
          TOR_ARGS=""
          if [ -f tor_bundle/tor/tor.exe ]; then
            TOR_ARGS="--add-data tor_bundle/tor;tor --add-data tor_bundle/data;data"
            echo "Built-in Tor included"
          else
            echo "No built-in Tor in this build"
          fi
          VER=$(python -c "from cindrix_overwatch import __version__ as v; print(v)")
          pyinstaller --onefile --windowed --icon cindrix_overwatch/data/icon.ico --name "CindrixOverwatch-$VER-windows" \
            --add-data "cindrix_overwatch/data;cindrix_overwatch/data" $TOR_ARGS run_overwatch.py
          ls -l dist/
      - name: Upload the exe (plain file, not zipped)
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.exe
          archive: false
      - name: Put the download links at the top of the run page
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "## Cindrix Overwatch build"
            echo ""
            echo "### [Download the exe from this run]($ARTIFACT_URL)"
            echo ""
            echo "Latest build on the Releases page: https://github.com/${GITHUB_REPOSITORY}/releases/tag/latest"
            echo ""
            echo "Windows may warn \"unknown publisher\" because the app is not code-signed. Choose More info, then Run anyway."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the exe as the latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/*.exe --target "$GITHUB_SHA" \
            --title "Cindrix Overwatch: latest build" \
            --notes "Built from commit ${GITHUB_SHA::7}. Windows may warn because the app is not code-signed: choose More info, then Run anyway."
  feed-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch every real source and list military feed links
        run: python -m tests.check_feeds
      - name: Tor check (onion addresses from the outlets' own sites, then a real fetch through Tor)
        continue-on-error: true
        run: |
          sudo apt-get install -y tor > /dev/null
          sudo service tor start || (tor --SocksPort 9050 --DataDirectory /tmp/tordata > /tmp/tor.log 2>&1 &)
          sleep 40
          python -m tests.check_tor
